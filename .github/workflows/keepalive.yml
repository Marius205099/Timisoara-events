name: Keep scheduled updates alive

# GitHub disables scheduled workflows in public repositories after 60 days without repository
# activity. An empty commit on the 1st of every month counts as activity, so the twice-daily
# website refresh (pages.yml) keeps running. Commits made with GITHUB_TOKEN do not trigger
# other workflows, so this does not start an extra website build.
on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep scheduled updates alive ($(date -u +%Y-%m))"
          git push
